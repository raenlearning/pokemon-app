name: pokemon_app
description: "Pokedex app"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  dio: ^5.9.1
  equatable: ^2.0.8
  cached_network_image: ^3.4.1

  flutter:
    sdk: flutter
  
  flutter_bloc: ^9.1.1
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  lottie: ^3.3.1
  responsive_framework: ^1.5.1
  get_it: ^8.3.0
  injectable: ^2.5.1
  injectable_generator: ^2.8.1
  build_runner: ^2.7.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/

  fonts:
    - family: pressStart2P  
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

  